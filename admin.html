<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración | TEZVO</title>
  <style>
    :root{--ink:#07101f;--blue:#1167ff;--paper:#f3f6fb;--muted:#64748b;--line:#dbe4f0;--red:#dc3545;--green:#16a464}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.top{background:var(--ink);color:#fff}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;font-size:1.25rem}.nav-actions{display:flex;gap:10px;align-items:center}.link{color:#d8e5f7;text-decoration:none}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;background:var(--blue);color:#fff}.btn.secondary{background:#e9eff8;color:var(--ink)}.btn.danger{background:#fff0f1;color:var(--red)}.btn.small{padding:8px 11px;font-size:.85rem}.login-shell{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 60px rgba(7,16,31,.1)}h1,h2,h3{letter-spacing:-.035em}.login h1{margin:0 0 8px}.muted{color:var(--muted)}label{display:block;font-weight:800;font-size:.88rem;margin-bottom:6px}.field{margin:16px 0}.input{width:100%;border:1px solid #cdd8e6;border-radius:12px;background:#fff;padding:12px 13px;outline:0}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(17,103,255,.12)}textarea.input{min-height:90px;resize:vertical}.login .btn{width:100%;margin-top:6px}.msg{margin-top:13px;border-radius:10px;padding:10px 12px;font-size:.9rem}.msg.error{background:#fff0f1;color:#a3212d}.msg.ok{background:#eafaf2;color:#087342}.dashboard{padding:34px 0 70px}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.heading h1{margin:0;font-size:2.5rem}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:22px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.panel h2{margin:0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.settings-grid .wide{grid-column:1/-1}.products{display:grid;gap:12px}.row{display:grid;grid-template-columns:70px 1.5fr .8fr .7fr auto;align-items:center;gap:14px;border:1px solid var(--line);border-radius:15px;padding:10px}.thumb{width:70px;height:64px;object-fit:cover;border-radius:10px;background:#edf2f8}.pname{font-weight:900}.sub{font-size:.82rem;color:var(--muted);margin-top:4px}.status{font-size:.8rem;font-weight:850;padding:6px 9px;border-radius:999px;background:#eafaf2;color:#087342;display:inline-block}.status.off{background:#edf0f4;color:#687386}.actions{display:flex;gap:7px;justify-content:flex-end}.empty{text-align:center;color:var(--muted);padding:28px}.modal{position:fixed;inset:0;background:rgba(2,8,20,.66);z-index:30;display:grid;place-items:center;padding:18px}.dialog{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0}.close{border:0;background:#edf1f6;border-radius:10px;width:38px;height:38px;font-size:1.3rem}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .wide{grid-column:1/-1}.check{display:flex;gap:9px;align-items:center;font-weight:750}.preview{width:100%;height:180px;object-fit:contain;background:#edf2f8;border-radius:14px;margin-top:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.loading{opacity:.58;pointer-events:none}.setup{background:#fff8e7;color:#795300;border:1px solid #f0d58d;border-radius:14px;padding:14px;margin-bottom:18px}
    @media(max-width:760px){.settings-grid,.form-grid{grid-template-columns:1fr}.settings-grid .wide,.form-grid .wide{grid-column:auto}.heading{align-items:flex-start;flex-direction:column}.row{grid-template-columns:58px 1fr auto}.thumb{width:58px;height:58px}.row .price,.row .category{display:none}.actions{flex-direction:column}.panel{padding:16px}.heading h1{font-size:2rem}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap nav"><div class="brand">Panel de administración</div><div class="nav-actions"><a class="link" href="index.html">Ver catálogo</a><button class="btn secondary small hidden" id="logout">Cerrar sesión</button></div></div></header>
  <section class="login-shell" id="login-view"><form class="login" id="login-form"><h1>Acceso privado</h1><p class="muted">Solo para administradores autorizados.</p><div class="setup hidden" id="setup-warning">Primero debes conectar Supabase en <b>config.js</b>.</div><div class="field"><label for="email">Correo</label><input class="input" id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Contraseña</label><input class="input" id="password" type="password" autocomplete="current-password" required minlength="6"></div><button class="btn" type="submit">Iniciar sesión</button><div id="login-msg"></div></form></section>
  <main class="wrap dashboard hidden" id="dashboard"><div class="heading"><div><h1>Administrar tienda</h1><div class="muted" id="admin-email"></div></div><button class="btn" id="new-product">+ Agregar producto</button></div>
    <section class="panel"><div class="panel-head"><h2>Datos de la tienda</h2><button class="btn" form="settings-form">Guardar cambios</button></div><form id="settings-form"><div class="settings-grid"><div><label for="store-name">Nombre de la tienda</label><input class="input" id="store-name" required maxlength="60"></div><div><label for="whatsapp">Número de WhatsApp</label><input class="input" id="whatsapp" inputmode="numeric" required placeholder="933320033"></div><div class="wide"><label for="hero-title">Título principal</label><input class="input" id="hero-title" required maxlength="100"></div><div class="wide"><label for="hero-text">Descripción principal</label><textarea class="input" id="hero-text" required maxlength="300"></textarea></div></div><div id="settings-msg"></div></form></section>
    <section class="panel"><div class="panel-head"><div><h2>Productos</h2><div class="muted">Edita, oculta o elimina productos.</div></div></div><div class="products" id="product-list"><div class="empty">Cargando…</div></div></section>
  </main>
  <div class="modal hidden" id="product-modal"><form class="dialog" id="product-form"><div class="dialog-head"><h2 id="modal-title">Agregar producto</h2><button type="button" class="close" id="close-modal">×</button></div><input type="hidden" id="product-id"><input type="hidden" id="current-image"><div class="form-grid"><div><label for="product-name">Nombre</label><input class="input" id="product-name" required maxlength="80"></div><div><label for="product-price">Precio en soles</label><input class="input" id="product-price" type="number" min="0" step="0.01" required></div><div><label for="product-category">Categoría</label><select class="input" id="product-category"><option value="audifonos">Audífonos</option><option value="cargadores">Cargadores</option><option value="cables">Cables</option><option value="accesorios">Accesorios</option></select></div><div><label for="product-badge">Etiqueta</label><input class="input" id="product-badge" maxlength="40" placeholder="Nuevo, Más vendido…"></div><div class="wide"><label for="product-specs">Características</label><input class="input" id="product-specs" maxlength="180" placeholder="USB-C · Carga rápida · Compatible"></div><div><label for="sort-order">Orden</label><input class="input" id="sort-order" type="number" min="0" step="1" value="0"></div><div><label>Visibilidad</label><label class="check"><input id="product-active" type="checkbox" checked> Mostrar en el catálogo</label></div><div class="wide"><label for="product-image">Imagen nueva (opcional)</label><input class="input" id="product-image" type="file" accept="image/jpeg,image/png,image/webp"><img class="preview" id="image-preview" src="assets/charger-white.png" alt="Vista previa"></div></div><div id="product-msg"></div><div class="dialog-actions"><button type="button" class="btn secondary" id="cancel-product">Cancelar</button><button type="submit" class="btn" id="save-product">Guardar producto</button></div></form></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
  <script>
    const cfg=window.TEZVO_CONFIG||{},configured=cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.startsWith('PEGA_')&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.startsWith('PEGA_'),db=configured?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));let products=[];
    const showMsg=(id,text,type='ok')=>$(id).innerHTML=text?`<div class="msg ${type}">${esc(text)}</div>`:'';
    function showLogin(){$('#login-view').classList.remove('hidden');$('#dashboard').classList.add('hidden');$('#logout').classList.add('hidden')}
    function showDashboard(email){$('#login-view').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#admin-email').textContent=email||'';loadAll()}
    async function verify(session){if(!session){showLogin();return}const {data}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(!data){await db.auth.signOut();showLogin();showMsg('#login-msg','Esta cuenta no está autorizada como administradora.','error');return}showDashboard(session.user.email)}
    async function loadAll(){const [{data:s,error:se},{data:p,error:pe}]=await Promise.all([db.from('store_settings').select('*').eq('id',1).single(),db.from('products').select('*').order('sort_order').order('created_at')]);if(s){$('#store-name').value=s.store_name;$('#whatsapp').value=s.whatsapp;$('#hero-title').value=s.hero_title;$('#hero-text').value=s.hero_text}if(se)showMsg('#settings-msg','No se pudieron cargar los datos.','error');products=p||[];renderProducts();if(pe)$('#product-list').innerHTML='<div class="empty">No se pudieron cargar los productos.</div>'}
    function renderProducts(){const root=$('#product-list');if(!products.length){root.innerHTML='<div class="empty">Todavía no hay productos.</div>';return}root.innerHTML=products.map(p=>`<div class="row"><img class="thumb" src="${esc(p.image_url||'assets/charger-white.png')}" alt=""><div><div class="pname">${esc(p.name)}</div><div class="sub">${esc(p.specs)}</div></div><div class="category">${p.category}</div><div class="price">S/ ${Number(p.price).toFixed(Number(p.price)%1?2:0)}<div><span class="status ${p.active?'':'off'}">${p.active?'Visible':'Oculto'}</span></div></div><div class="actions"><button class="btn secondary small" data-edit="${p.id}">Editar</button><button class="btn danger small" data-delete="${p.id}">Eliminar</button></div></div>`).join('');root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openProduct(products.find(p=>p.id===b.dataset.edit)));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete))}
    function openProduct(p=null){$('#product-form').reset();$('#product-id').value=p?.id||'';$('#current-image').value=p?.image_url||'';$('#modal-title').textContent=p?'Editar producto':'Agregar producto';$('#product-name').value=p?.name||'';$('#product-price').value=p?.price??'';$('#product-category').value=p?.category||'accesorios';$('#product-badge').value=p?.badge||'';$('#product-specs').value=p?.specs||'';$('#sort-order').value=p?.sort_order??products.length+1;$('#product-active').checked=p?.active??true;$('#image-preview').src=p?.image_url||'assets/charger-white.png';showMsg('#product-msg','');$('#product-modal').classList.remove('hidden')}
    function closeProduct(){$('#product-modal').classList.add('hidden')}
    async function uploadImage(file){if(!file)return $('#current-image').value;if(file.size>5*1024*1024)throw new Error('La imagen debe pesar menos de 5 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=`${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('product-images').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
    $('#login-form').addEventListener('submit',async e=>{e.preventDefault();showMsg('#login-msg','');const btn=e.submitter;btn.disabled=true;const {data,error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});btn.disabled=false;if(error){showMsg('#login-msg','Correo o contraseña incorrectos.','error');return}verify(data.session)});
    $('#logout').onclick=async()=>{await db.auth.signOut();showLogin()};
    $('#settings-form').addEventListener('submit',async e=>{e.preventDefault();showMsg('#settings-msg','');const whatsapp=$('#whatsapp').value.replace(/\D/g,'');if(whatsapp.length<9){showMsg('#settings-msg','Revisa el número de WhatsApp.','error');return}const {error}=await db.from('store_settings').update({store_name:$('#store-name').value.trim(),whatsapp,hero_title:$('#hero-title').value.trim(),hero_text:$('#hero-text').value.trim(),updated_at:new Date().toISOString()}).eq('id',1);showMsg('#settings-msg',error?'No se pudieron guardar los cambios.':'Cambios guardados.',error?'error':'ok')});
    $('#product-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;form.classList.add('loading');showMsg('#product-msg','');try{const image_url=await uploadImage($('#product-image').files[0]);const payload={name:$('#product-name').value.trim(),price:Number($('#product-price').value),category:$('#product-category').value,badge:$('#product-badge').value.trim(),specs:$('#product-specs').value.trim(),sort_order:Number($('#sort-order').value)||0,active:$('#product-active').checked,image_url:image_url||'assets/charger-white.png',updated_at:new Date().toISOString()},id=$('#product-id').value;const {error}=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(error)throw error;await loadAll();closeProduct()}catch(err){showMsg('#product-msg',err.message||'No se pudo guardar el producto.','error')}finally{form.classList.remove('loading')}});
    async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!confirm(`¿Eliminar ${p?.name||'este producto'}?`))return;const {error}=await db.from('products').delete().eq('id',id);if(error){alert('No se pudo eliminar.');return}await loadAll()}
    $('#new-product').onclick=()=>openProduct();$('#close-modal').onclick=closeProduct;$('#cancel-product').onclick=closeProduct;$('#product-image').onchange=e=>{const f=e.target.files[0];if(f)$('#image-preview').src=URL.createObjectURL(f)};$('#product-modal').onclick=e=>{if(e.target===$('#product-modal'))closeProduct()};
    if(!configured){$('#setup-warning').classList.remove('hidden');$('#login-form button').disabled=true}else{db.auth.getSession().then(({data})=>verify(data.session));db.auth.onAuthStateChange((_,session)=>{if(!session)showLogin()})}
  </script>
</body>
</html>
